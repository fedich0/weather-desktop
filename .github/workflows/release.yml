name: Prepare release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release candidate tag (must match the app version)'
        required: true
        default: v0.9.0-rc.1
        type: string
permissions:
  contents: read
concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' src/Info.plist)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" == "v$version-rc."* ]]
      - name: Test and build
        run: bash scripts/check-macos.sh
      - name: Package universal application
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WeatherDesktop-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Weather Desktop $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            --draft --prerelease
